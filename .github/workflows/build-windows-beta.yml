name: Build Windows x64 beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build environment manager
        run: python -m pip install uv==0.12.2
      - name: Build and verify beta
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Upload tested beta ZIP and diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: LocalComicTranslate-windows-x64-beta
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
